[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praude"
version = "0.1.3"
description = "Turn a YesWeHack program into a Claude bug-bounty scope file"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jinja2",
    "requests",
]

[project.scripts]
praude = "praude.cli:main"

[tool.hatch.build.targets.wheel]
include = ["praude"]
